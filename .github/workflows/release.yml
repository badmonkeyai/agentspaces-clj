# Publishes the library to Clojars when a version tag (v0.2.0, ...) is pushed.
# The tag must match the version in build.clj. Repository secrets:
#   CLOJARS_USERNAME  the Clojars account
#   CLOJARS_PASSWORD  a Clojars deploy token (not the account password)
# The ai.badmonkey.agentspaces group must be verified on that Clojars account.
name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up the Clojure CLI
        uses: DeLaGuardo/setup-clojure@f556541eb28a9303896cee0679ba9f60b898300f # 13.5
        with:
          cli: 1.12.4.1618
      # A release tests against the exact core it depends on: the core tag
      # v<version> for the agentspaces version deps.edn names, never main.
      # Until the core artifacts are on Maven Central, the core is built from
      # that tag; once they are, these three steps can be removed.
      - name: Find the core version deps.edn depends on
        run: |
          core=$(sed -n 's|.*ai.badmonkey.agentspaces/agentspaces-common {:mvn/version "\(.*\)"}.*|\1|p' deps.edn)
          test -n "$core" || { echo "no agentspaces-common version in deps.edn"; exit 1; }
          echo "AGENTSPACES_REF=v$core" >> "$GITHUB_ENV"
      - name: Check out AgentSpaces core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: badmonkeyai/AgentSpaces
          ref: ${{ env.AGENTSPACES_REF }}
          path: agentspaces-core
      - name: Install AgentSpaces core
        run: mvn -B -ntp -f agentspaces-core/pom.xml install -DskipTests
      - name: Test
        run: clojure -M:test
      - name: Check the tag matches the build version
        run: |
          version=$(sed -n 's/^(def version "\(.*\)")$/\1/p' build.clj)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match build.clj version $version"; exit 1; }
      - name: Deploy to Clojars
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -T:build:deploy deploy
