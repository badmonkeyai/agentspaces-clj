name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege for the default GITHUB_TOKEN: the build only reads.
permissions:
  contents: read

env:
  # The AgentSpaces core the bindings run on. Until the core 0.2.0 artifacts
  # are on Maven Central, CI builds them from source first; once they are, the
  # "AgentSpaces core" steps can be removed.
  AGENTSPACES_REF: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up the Clojure CLI
        uses: DeLaGuardo/setup-clojure@f556541eb28a9303896cee0679ba9f60b898300f # 13.5
        with:
          cli: 1.12.4.1618
      - name: Check out AgentSpaces core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: badmonkeyai/AgentSpaces
          ref: ${{ env.AGENTSPACES_REF }}
          path: agentspaces-core
      - name: Install AgentSpaces core
        run: mvn -B -ntp -f agentspaces-core/pom.xml install -DskipTests
      - name: Test
        run: clojure -M:test
      - name: Build the jar
        run: clojure -T:build jar
