# Supply-chain updates for the pinned GitHub Actions. Dependabot does not read
# deps.edn; the agentspaces-* versions follow the core's releases, and Clojure
# and tools.build are bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
